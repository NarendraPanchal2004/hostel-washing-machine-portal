name: Build Android APK

on:
  push:
    branches: [ main, feature/hostel-management-system ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Dist Bundle
        run: node scripts/build_dist.js

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/HostelMate.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HostelMate-Debug-APK
          path: android/app/build/outputs/apk/debug/HostelMate.apk
          if-no-files-found: error

      - name: Release APK Direct Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "HostelMate Official Android App (APK)"
          body: |
            ## 📱 HostelMate Official Android App (APK)

            Download and install the official HostelMate Android APK directly on your phone.

            ### Direct Download Link:
            👉 [Download HostelMate.apk](https://github.com/NarendraPanchal2004/hostel-washing-machine-portal/releases/download/v1.0.0/HostelMate.apk)

            ### Features included in this app:
            - 🧺 **Washing Machine Booking**: 4 heavy-duty machines, 75-minute slots, live status & ticket save to gallery
            - 🚪 **Gate Entry & Exit**: Anti-replay QR scanning and resident pass
            - 🍽️ **Mess Management**: Veg/Non-Veg daily diet selection, weekly menu & attendance
            - 🏸 **Sports & Labs**: Facility and equipment booking
            - ☀️ **Morning Attendance**: Check-in and wake-up reminder
            - 📢 **Notices & Complaints**: Instant notifications and issue tracker
          files: |
            android/app/build/outputs/apk/debug/HostelMate.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
